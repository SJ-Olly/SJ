<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Line drawing of a row of Yarm High Street frontages, one bay highlighted</title>
  <g fill="none" stroke="#141414" stroke-width="1.6">
    <!-- ground line -->
    <line x1="0" y1="240" x2="640" y2="240" stroke="#8e867a" stroke-width="1"/>

    <!-- building A: narrow -->
    <rect x="16" y="176" width="96" height="64"/>
    <polyline points="16,176 64,132 112,176"/>
    <rect x="40" y="196" width="18" height="44"/>
    <rect x="70" y="192" width="16" height="18"/>

    <!-- building B: wide, accented -->
    <rect x="140" y="146" width="256" height="94"/>
    <polyline points="140,146 268,84 396,146" stroke="#d8651e" stroke-width="2"/>
    <rect x="170" y="176" width="22" height="64"/>
    <rect x="210" y="168" width="26" height="26"/>
    <rect x="252" y="168" width="26" height="26"/>
    <rect x="330" y="168" width="26" height="26"/>
    <rect x="200" y="120" width="16" height="20" stroke="#d8651e"/>
    <rect x="230" y="120" width="16" height="20" stroke="#d8651e"/>

    <!-- building C: narrow -->
    <rect x="420" y="186" width="118" height="54"/>
    <polyline points="420,186 479,150 538,186"/>
    <rect x="445" y="204" width="18" height="36"/>
    <rect x="475" y="200" width="16" height="18"/>
    <rect x="500" y="200" width="16" height="18"/>

    <!-- building D: cropped sliver, continues off-canvas -->
    <rect x="560" y="196" width="80" height="44"/>
    <polyline points="560,196 596,164 640,196"/>
    <rect x="580" y="212" width="14" height="28"/>
  </g>
</svg>
